# Default values for static-file-server.
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

revisionHistoryLimit: 3

image:
  repository: somaz940/static-file-server
  pullPolicy: IfNotPresent
  tag: "v0.9.0"

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # The server never calls the Kubernetes API, so no token is mounted by default.
  automount: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Static file server configuration (environment variables)
config:
  folder: /web
  port: "8080"
  cors: "false"
  debug: "false"
  allowIndex: "true"
  showListing: "true"
  urlPrefix: ""
  # TLS (optional)
  tlsCert: ""
  tlsKey: ""
  tlsMinVers: ""
  # Access control (optional)
  referrers: ""
  accessKey: ""
  # Custom response headers (optional, comma-separated Key:Value pairs)
  customHeaders: ""
  # New features (optional)
  spa: "false"
  compression: "false"
  hideDotFiles: "false"
  logFormat: "text"
  metrics: "false"

# Extra environment variables
extraEnv: []
# Example:
#   - name: CUSTOM_VAR
#     value: "custom-value"

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: files.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: files-tls
  #    hosts:
  #      - files.example.com

# Gateway API HTTPRoute — alternative to Ingress when using a Gateway API
# implementation (NGINX Gateway Fabric, Istio, Cilium, Contour, etc.).
# Enable either `ingress` or `httproute`, not both.
#
# HTTPS notes:
#   - TLS termination is declared on the Gateway's listener, not here.
#   - For HTTPS traffic, set `parentRefs[*].sectionName` to the HTTPS listener
#     name on your Gateway (e.g. "https").
#   - To force HTTP → HTTPS redirect, enable `httproute.httpsRedirect`; it
#     renders a sibling HTTPRoute bound to the HTTP listener with a
#     RequestRedirect filter (scheme=https, default 301).
httproute:
  enabled: false
  annotations: {}

  # One or more Gateways to attach to. Gateway must have `allowedRoutes`
  # permitting this namespace (or `from: All`).
  parentRefs:
    - name: ""
      # namespace: nginx-gateway
      # sectionName: https   # bind to a specific listener (e.g. https / http)
      # port: 443            # rarely needed; usually inferred from the listener

  hostnames: []
    # - files.example.com

  rules:
    - matches:
        - path:
            type: PathPrefix   # PathPrefix | Exact | RegularExpression
            value: /
          # headers:           # optional
          #   - name: X-Env
          #     value: prod
          # queryParams: []    # optional
          # method: GET        # optional
      # filters:                # optional — URLRewrite / RequestRedirect /
      #   - type: URLRewrite    #            RequestHeaderModifier / etc.
      #     urlRewrite:
      #       path:
      #         type: ReplacePrefixMatch
      #         replacePrefixMatch: /
      # timeouts:               # optional
      #   request: 60s
      #   backendRequest: 30s
      backendRefs:
        # name defaults to the chart fullname (this release's Service),
        # port to .Values.service.port; weight is optional.
        - {}

  # HTTP → HTTPS redirect (sibling HTTPRoute on the HTTP listener).
  # Requires your Gateway to expose both HTTP and HTTPS listeners and your
  # main route above to bind to the HTTPS listener via sectionName.
  httpsRedirect:
    enabled: false
    statusCode: 301            # 301 | 302 | 307 | 308
    # port: 443                # only if the HTTPS listener uses a non-default port
    parentRefs:
      - name: ""
        # namespace: nginx-gateway
        # sectionName: http

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 32Mi

# timeoutSeconds / failureThreshold are optional per probe; unset keeps the Kubernetes defaults (1s / 3).
probes:
  liveness:
    enabled: true
    path: /healthz
    port: http
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    enabled: true
    path: /healthz
    port: http
    initialDelaySeconds: 3
    periodSeconds: 5

# ---------------------------------------------------------------------------
# Storage: 3 modes (choose one)
# ---------------------------------------------------------------------------

# Mode 1: Simple dynamic provisioning (single PVC)
persistence:
  enabled: false
  accessMode: ReadOnlyMany
  size: 1Gi
  storageClass: ""
  existingClaim: ""

# Mode 2: Static provisioning with full control (multiple PVs + PVCs)
# Each PVC item's mountPath is used in the Deployment volumeMounts.
persistentVolumes:
  enabled: false
  items: []
  # Example (NFS):
  #   - name: static-file-server-pv
  #     storage: 5Gi
  #     volumeMode: Filesystem
  #     accessModes:
  #       - ReadWriteMany
  #     reclaimPolicy: Retain
  #     storageClassName: nfs-client
  #     nfs:
  #       server: 203.0.113.5
  #       path: /volume1/nfs
  #
  # Example (HostPath):
  #   - name: local-pv
  #     storage: 10Gi
  #     accessModes:
  #       - ReadWriteOnce
  #     storageClassName: local-storage
  #     hostPath:
  #       path: /data/web
  #       type: DirectoryOrCreate
  #
  # Example (CSI):
  #   - name: csi-pv
  #     storage: 20Gi
  #     accessModes:
  #       - ReadWriteOnce
  #     storageClassName: ebs-sc
  #     csi:
  #       driver: ebs.csi.aws.com
  #       volumeHandle: vol-0123456789abcdef

persistentVolumeClaims:
  enabled: false
  items: []
  # Example:
  #   - name: static-file-server-pvc
  #     accessModes:
  #       - ReadWriteMany
  #     storageClassName: nfs-client
  #     storage: 5Gi
  #     mountPath: /web
  #     volumeName: static-file-server-pv  # bind to specific PV (optional)

# Mode 3: ConfigMap-based content (for small static sites)
content:
  enabled: false
  files: {}
  # Example:
  #   index.html: |
  #     <html><body><h1>Hello!</h1></body></html>

# Extra volumes to add to the deployment
extraVolumes: []
# Example:
#   - name: extra-data
#     configMap:
#       name: my-configmap

# Extra volume mounts to add to the container
extraVolumeMounts: []
# Example:
#   - name: extra-data
#     mountPath: /extra
#     readOnly: true

# What the pod serves: "all" (file server, plus the cache endpoint when s3Cache is
# enabled) or "cache" (only the cache endpoint: no file listener, content volumes,
# file Service, Ingress or HTTPRoute). "cache" requires s3Cache.enabled=true.
mode: all

# ---------------------------------------------------------------------------
# GitLab Runner cache endpoint (S3 presigned subset), see docs/s3-cache.md.
# Runs on its own port and Service; the file server stays read-only.
# ---------------------------------------------------------------------------
s3Cache:
  enabled: false
  port: 9000
  # Writable directory inside the container. Must not be served by the file
  # server: keep it outside config.folder, or below a dot directory with
  # config.hideDotFiles=true.
  folder: /cache
  # Secret with the credentials the runner signs with (required when enabled).
  existingSecret: ""
  accessKeyKey: accessKey
  secretKeyKey: secretKey
  buckets: ""        # comma-separated allowlist; empty accepts any bucket name
  ttl: ""            # Go duration such as 336h, measured from the last upload or read; empty keeps objects forever
  maxObjectSize: ""  # bytes; empty means unlimited
  maxTotalSize: ""   # bytes; least recently used objects are evicted above this, empty means unlimited
  # Writable storage at folder, in order of precedence: existingClaim, then a
  # chart-created PVC (persistence), else an emptyDir (lost on restart).
  existingClaim: ""
  subPath: ""
  persistence:
    enabled: false
    storageClass: ""
    accessMode: ReadWriteOnce  # ReadWriteMany when replicaCount > 1
    size: 10Gi
  service:
    type: ClusterIP
    port: 9000
    annotations: {}

# Prometheus Operator ServiceMonitor scraping /metrics on the http port, plus the
# s3 port when s3Cache is enabled. Requires config.metrics="true".
serviceMonitor:
  enabled: false
  labels: {}         # extra labels, e.g. the release label an operator's serviceMonitorSelector expects
  interval: ""       # empty uses the Prometheus global scrape interval
  scrapeTimeout: ""
  tlsConfig: {}      # used when config.tlsCert is set, e.g. {insecureSkipVerify: true} for a self-signed cert

nodeSelector: {}
tolerations: []
affinity: {}

# Spread replicas across nodes, e.g.
#   - maxSkew: 1
#     topologyKey: kubernetes.io/hostname
#     whenUnsatisfiable: ScheduleAnyway
# labelSelector defaults to this release's pods when omitted.
topologySpreadConstraints: []

# Deployment update strategy; empty keeps the Kubernetes default (RollingUpdate 25%/25%), except
# with a chart-created ReadWriteOnce s3Cache claim, which gets Recreate.
strategy: {}

priorityClassName: ""

# Empty keeps the Kubernetes default (30s). The server drains for at most 10s on SIGTERM.
terminationGracePeriodSeconds: ""

# Image for `helm test` (a wget against /healthz).
tests:
  image: busybox:1.37

# Limits voluntary disruptions (node drains). Set exactly one of minAvailable / maxUnavailable.
podDisruptionBudget:
  enabled: false
  minAvailable: ""
  maxUnavailable: 1
