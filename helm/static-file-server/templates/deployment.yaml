{{- $cacheOnly := include "static-file-server.cacheOnly" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "static-file-server.fullname" . }}
  labels:
    {{- include "static-file-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "static-file-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "static-file-server.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "static-file-server.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if $cacheOnly }}
          args: ["cache"]
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            {{- if not $cacheOnly }}
            - name: http
              containerPort: {{ int .Values.config.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.s3Cache.enabled }}
            - name: s3
              containerPort: {{ int .Values.s3Cache.port }}
              protocol: TCP
            {{- end }}
          env:
            - name: FOLDER
              value: {{ .Values.config.folder | quote }}
            - name: PORT
              value: {{ .Values.config.port | quote }}
            - name: CORS
              value: {{ .Values.config.cors | quote }}
            - name: DEBUG
              value: {{ .Values.config.debug | quote }}
            - name: ALLOW_INDEX
              value: {{ .Values.config.allowIndex | quote }}
            - name: SHOW_LISTING
              value: {{ .Values.config.showListing | quote }}
            {{- if .Values.config.urlPrefix }}
            - name: URL_PREFIX
              value: {{ .Values.config.urlPrefix | quote }}
            {{- end }}
            {{- if .Values.config.tlsCert }}
            - name: TLS_CERT
              value: {{ .Values.config.tlsCert | quote }}
            {{- end }}
            {{- if .Values.config.tlsKey }}
            - name: TLS_KEY
              value: {{ .Values.config.tlsKey | quote }}
            {{- end }}
            {{- if .Values.config.tlsMinVers }}
            - name: TLS_MIN_VERS
              value: {{ .Values.config.tlsMinVers | quote }}
            {{- end }}
            {{- if .Values.config.referrers }}
            - name: REFERRERS
              value: {{ .Values.config.referrers | quote }}
            {{- end }}
            {{- if .Values.config.accessKey }}
            - name: ACCESS_KEY
              value: {{ .Values.config.accessKey | quote }}
            {{- end }}
            {{- if .Values.config.customHeaders }}
            - name: CUSTOM_HEADERS
              value: {{ .Values.config.customHeaders | quote }}
            {{- end }}
            {{- if eq (.Values.config.spa | toString) "true" }}
            - name: SPA
              value: {{ .Values.config.spa | quote }}
            {{- end }}
            {{- if eq (.Values.config.compression | toString) "true" }}
            - name: COMPRESSION
              value: {{ .Values.config.compression | quote }}
            {{- end }}
            {{- if eq (.Values.config.hideDotFiles | toString) "true" }}
            - name: HIDE_DOT_FILES
              value: {{ .Values.config.hideDotFiles | quote }}
            {{- end }}
            {{- if ne (.Values.config.logFormat | default "text") "text" }}
            - name: LOG_FORMAT
              value: {{ .Values.config.logFormat | quote }}
            {{- end }}
            {{- if eq (.Values.config.metrics | toString) "true" }}
            - name: METRICS
              value: {{ .Values.config.metrics | quote }}
            {{- end }}
            {{- if .Values.s3Cache.enabled }}
            {{- include "static-file-server.s3CacheEnv" . | nindent 12 }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ if $cacheOnly }}s3{{ else }}{{ .Values.probes.liveness.port }}{{ end }}
              {{- if .Values.config.tlsCert }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ if $cacheOnly }}s3{{ else }}{{ .Values.probes.readiness.port }}{{ end }}
              {{- if .Values.config.tlsCert }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if $cacheOnly }}
            {{- else if .Values.persistentVolumeClaims.enabled }}
            {{- range .Values.persistentVolumeClaims.items }}
            - name: {{ .name }}
              mountPath: {{ .mountPath | default "/web" }}
              readOnly: {{ ternary .readOnly true (hasKey . "readOnly") }}
            {{- end }}
            {{- else }}
            - name: web-content
              mountPath: {{ .Values.config.folder }}
              readOnly: true
            {{- end }}
            {{- if .Values.s3Cache.enabled }}
            - name: s3-cache
              mountPath: {{ .Values.s3Cache.folder }}
              {{- with .Values.s3Cache.subPath }}
              subPath: {{ . }}
              {{- end }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- if $cacheOnly }}
        {{- else if .Values.persistentVolumeClaims.enabled }}
        {{- range .Values.persistentVolumeClaims.items }}
        - name: {{ .name }}
          persistentVolumeClaim:
            claimName: {{ .name }}
        {{- end }}
        {{- else if .Values.persistence.enabled }}
        - name: web-content
          persistentVolumeClaim:
            claimName: {{ include "static-file-server.dataClaimName" . }}
        {{- else if .Values.content.enabled }}
        - name: web-content
          configMap:
            name: {{ include "static-file-server.fullname" . }}-content
        {{- else }}
        - name: web-content
          emptyDir: {}
        {{- end }}
        {{- if .Values.s3Cache.enabled }}
        - name: s3-cache
          {{- if .Values.s3Cache.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.s3Cache.existingClaim }}
          {{- else if .Values.s3Cache.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "static-file-server.fullname" . }}-s3-cache
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
