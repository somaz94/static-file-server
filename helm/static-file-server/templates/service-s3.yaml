{{- if .Values.s3Cache.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "static-file-server.fullname" . }}-s3
  labels:
    {{- include "static-file-server.labels" . | nindent 4 }}
  {{- with .Values.s3Cache.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.s3Cache.service.type }}
  ports:
    - port: {{ .Values.s3Cache.service.port }}
      targetPort: s3
      protocol: TCP
      name: s3
  selector:
    {{- include "static-file-server.selectorLabels" . | nindent 4 }}
{{- end }}
